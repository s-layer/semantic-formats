# .doc-writer/config.yaml — generated by /doc-writer:setup
version: 1

plugin_version: "1.7.1"

user_personas:
  - name: "Python integrator"
    skill_level: "advanced"
    assumed_knowledge:
      - "Python 3.11+ and type hints"
      - "pydantic v2 models, model_validate and ValidationError"
      - "JSON Schema (draft 2020-12) and validators such as jsonschema"
      - "dbt semantic layer concepts: semantic models, metrics, dimensions, config.meta"
      - "Warehouse semantic views and tags (Snowflake semantic views, Databricks metric views)"
    never_assume:
      - "What the s_layer block is and how its sections (value, display, time, aggregation) divide the work"
      - "Which kinds apply to which member type (metric, fact, dimension)"
      - "What the normal form is and that equality is defined on it"
      - "The S_LAYER_KIND / S_LAYER_SPEC / S_LAYER_LABEL tag split and the 256-character limit"
      - "Which rules the JSON Schema does not check"
    domain_context: >-
      Builds tooling around dbt semantic models: code generators that write warehouse
      semantic views (as dbt-s-layer does) or query and BI libraries that read members back
      out of the warehouse (as semolina does). Both sides need one shared definition of what
      a metric, fact or dimension means, and a way to round-trip it through warehouse tags.
    discovery_story: >-
      Arrived from dbt-s-layer or semolina, or from the s_layer key in a dbt project, and
      needs to read, validate, compare or write s_layer blocks in their own tool.
    user_tasks:
      - "Validate a block read from dbt YAML or a manifest for a given member type"
      - "Report every validation problem with its path"
      - "Compare two blocks, or detect drift, using the normal form"
      - "Write the S_LAYER_SPEC tag payload and read tags back into a block"
      - "Use the shipped JSON Schema in an editor, a linter or another language"
      - "Read typed attributes (kind, additivity, extensions) from a parsed block"
  - name: "Analytics engineer"
    skill_level: "intermediate"
    assumed_knowledge:
      - "dbt projects and YAML property files"
      - "dbt semantic models, metrics, dimensions and config.meta"
      - "SQL and warehouse concepts such as additive and semi-additive measures"
      - "Running a Python command or script when told exactly what to type"
    never_assume:
      - "Python APIs, pydantic or JSON Schema internals"
      - "What the s_layer block is and which keys are allowed in each section"
      - "Which kinds apply to metrics, facts and dimensions"
      - "Which display and time keys fit which kind, and which defaults are filled in"
      - "What x- extension keys are and how they are treated"
    domain_context: >-
      Writes and reviews dbt YAML for a semantic layer and wants dashboards to format
      revenue as currency, ratios as percentages and dates at the right grain. Reads the
      docs to learn exactly which keys are allowed in a config.meta.s_layer block and what
      an error message means.
    discovery_story: >-
      A teammate added dbt-s-layer to the project, or a validation error mentioned s_layer,
      and the engineer looked for the list of allowed keys and kinds.
    user_tasks:
      - "Write a valid s_layer block for a metric, fact or dimension"
      - "Pick the right kind and its required keys"
      - "Set display hints (decimals, compact, negative, grouping, date_style)"
      - "Set time grain and fiscal year start on a date dimension"
      - "Declare additivity for a semi-additive metric"
      - "Understand a validation error and fix the YAML"

tone: "warm-businesslike"

use_cases: []

use_cases_section: false

doc_system: "sphinx-shibuya"
api_reference: "docs/reference/api (sphinx-autoapi, generated at build time)"

paths:
  docs_root: "docs/"
  source_root: "src/s_layer_semantic_formats/"

detected:
  language: "python"
  doc_system: "sphinx-shibuya"
  existing_docs: true

qa_answers:
  navigation: "Sections as top tabs"
  api_docs: "sphinx-autoapi (Recommended)"
  features:
    - "Grids + cards"
    - "Tab sets"
    - "Dropdowns"
  extras:
    - "sphinx.ext.intersphinx (python, pydantic, jsonschema)"
    - "autoapi_root = reference/api, autoapi_add_toctree_entry = False"
    - "autoapi_python_class_content = both, autoapi_member_order = bysource"
    - "napoleon_google_docstring = True, napoleon_numpy_docstring = False, napoleon_use_ivar = True"
  extras_skipped:
    - "sphinxcontrib.mermaid (not a docs dependency; no page needs a diagram)"
